name: App

on:
  push:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Write key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          echo KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} > signing.properties
          echo KEYSTORE_ALIAS=${{ secrets.KEYSTORE_ALIAS }} >> signing.properties
          echo KEYSTORE_ALIAS_PASSWORD='${{ secrets.KEYSTORE_ALIAS_PASSWORD }}' >> signing.properties
          echo KEYSTORE_FILE=../key.jks >> signing.properties
          echo ${{ secrets.KEYSTORE }} | base64 --decode > key.jks
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          dependency-graph: generate-and-submit
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"
      - name: Build with Gradle
        id: buildWithGradle
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          echo 'android.sdk.channel=3' >> gradle.properties
          echo 'android.native.buildOutput=verbose' >> gradle.properties
          echo 'org.gradle.caching=true' >> gradle.properties
          echo 'org.gradle.parallel=true' >> gradle.properties
          # 仓库里的 gradle.properties 带 -Djava.io.tmpdir=E:/tmp（开发机专用，Linux runner
          # 不存在该目录 → Gradle 启动即抛 IOException）。properties 文件同名键后者生效，
          # 这里覆盖回不带 tmpdir 的版本；开发机的本机配置不受影响。
          echo 'org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8' >> gradle.properties
          # runner 上没有 signing.properties（.gitignore 掉的开发机配置）→ signing.gradle
          # 回退到 debug keystore，但 ~/.config/.android/debug.keystore 不会被自动创建，
          # validateSigningDebug/Release 会直接失败。这里按 android 惯例参数预生成一个
          # （仅用于 CI 构建验证产物；正式发版签名走 secrets，见 Write key 步骤）。
          mkdir -p "$HOME/.config/.android" "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.config/.android/debug.keystore" -storetype JKS \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          cp "$HOME/.config/.android/debug.keystore" "$HOME/.android/debug.keystore"
          ./gradlew :manager:assemble
          # 产物名是 fork 自定的 shizako-zako3.13-release.apk（上游是 shizuku-v*-release.apk，
          # 旧 glob 在这里永远匹配不到 → ls 失败 + bash -e → 构建步骤假红）
          releaseName=`ls manager/build/outputs/apk/release/shizako*-release.apk | awk -F '(/|-release.apk)' '{print $6}'` && echo "releaseName=$releaseName" >> $GITHUB_OUTPUT
      - name: Upload release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.buildWithGradle.outputs.releaseName }}
          path: "manager/build/outputs"
          compression-level: 9

      # ── 发版：推送 tag 时用仓库自带的 GITHUB_TOKEN 建 GitHub Release ──
      # 为什么不放在本机做：api.github.com 在开发机网络上被墙（DNS 超时），
      # 但 git 协议可达 github.com；让 runner 去调 API 最稳。
      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - "$TAG" <<'PY'
          import re, sys
          tag = sys.argv[1]
          text = open('更新日志.md', encoding='utf-8').read()
          m = re.search(
              r'^## ' + re.escape(tag) + r' .*?\n(.*?)(?=^---\s*$|^## zako|\Z)',
              text, re.S | re.M,
          )
          body = m.group(1).strip() if m else f'Release {tag}'
          open('release_body.md', 'w', encoding='utf-8').write(body)
          print(f'release notes for {tag}: {len(body)} chars')
          PY

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # 只建带更新说明的 Release；APK 由维护者用本地签名包手动上传
          # （CI 里 Write key 的条件仍是 refs/heads/master，且仓库已改名 main，
          #   所以 CI 产物是 debug 签名的，直接挂上去会和正式签名冲突）。
          gh release create "$TAG" --title "$TAG" --notes-file release_body.md --verify-tag \
            || gh release edit "$TAG" --title "$TAG" --notes-file release_body.md

      # ── 兜底：main 推送时，如果 build.gradle 的版本 tag 已经推到远端但还没有
      #    Release，就补建一个。
      # 为什么需要这一条：GitHub 的 tag 事件只会用「tag 所指提交」里的 workflow，
      # 所以给已存在的 tag 补发 Release 时，tag 上的旧 workflow 读不到新步骤，
      # 必须由 main 分支上的 workflow 来补。
      - name: Ensure release for current version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' build.gradle | head -1)
          echo "current version tag: $TAG"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG not pushed yet, skip"
            exit 0
          fi
          python3 - "$TAG" <<'PY'
          import re, sys
          tag = sys.argv[1]
          text = open('更新日志.md', encoding='utf-8').read()
          m = re.search(
              r'^## ' + re.escape(tag) + r' .*?\n(.*?)(?=^---\s*$|^## zako|\Z)',
              text, re.S | re.M,
          )
          body = m.group(1).strip() if m else f'Release {tag}'
          open('release_body.md', 'w', encoding='utf-8').write(body)
          print(f'release notes for {tag}: {len(body)} chars')
          PY
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --notes-file release_body.md --verify-tag
            echo "release $TAG created"
          fi
