pluginManagement {
    // F-Droid 构建（-Pfdroid）不使用阿里云镜像：他们的构建机在海外、依赖源固定为
    // 官方仓库，国内镜像对它毫无意义反而可能被拒。不带 -Pfdroid 的本地/GitHub 构建
    // 行为完全不变（仍然阿里云优先）。同一个 -Pfdroid 也驱动 manager 的 FDROID_BUILD
    // 开关，一处属性管到底 —— 见 tools/fdroid/变体方案.md。
    def useCnMirrors = !gradle.startParameter.projectProperties.containsKey("fdroid")
    repositories {
        // CN mirrors (Aliyun) first, fall back to originals
        if (useCnMirrors) {
            maven {
                url("https://maven.aliyun.com/repository/google")
                content {
                    includeGroupByRegex("com\\.android.*")
                    includeGroupByRegex("com\\.google.*")
                    includeGroupByRegex("androidx.*")
                }
            }
            maven {
                url("https://maven.aliyun.com/repository/public")
                content {
                    includeGroupByRegex("org\\.jetbrains.*")
                    includeGroupByRegex("org\\.jetbrains\\.kotlin.*")
                    includeGroupByRegex("dev\\.rikka.*")
                }
            }
            maven {
                url("https://maven.aliyun.com/repository/gradle-plugin")
            }
        }
        google()
        mavenLocal()
        mavenCentral()
        // F-Droid 路径补上官方插件门户（阿里云 gradle-plugin 镜像被关掉后的等价兜底；
        // 本地路径不加，保持原有仓库顺序不变）
        if (!useCnMirrors) {
            gradlePluginPortal()
        }
    }
    plugins {
        id("com.android.application") version "8.10.1"
        id("com.android.library") version "8.10.1"
        id("org.jetbrains.kotlin.android") version "2.2.21"
        id("org.jetbrains.kotlin.plugin.compose") version "2.2.21"
        id("dev.rikka.tools.autoresconfig") version "1.2.2"
        id("dev.rikka.tools.materialthemebuilder") version "1.5.1"
        id("dev.rikka.tools.refine") version "4.4.0"
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // CN mirrors (Aliyun) first, fall back to originals
        // （-Pfdroid 时关闭，理由见文件顶部 pluginManagement 处的说明）
        if (!gradle.startParameter.projectProperties.containsKey("fdroid")) {
            maven {
                url("https://maven.aliyun.com/repository/google")
                content {
                    includeGroupByRegex("com\\.android.*")
                    includeGroupByRegex("com\\.google.*")
                    includeGroupByRegex("androidx.*")
                }
            }
            maven {
                url("https://maven.aliyun.com/repository/public")
                content {
                    includeGroupByRegex("org\\.jetbrains.*")
                    includeGroupByRegex("org\\.jetbrains\\.kotlin.*")
                    includeGroupByRegex("dev\\.rikka.*")
                    includeGroupByRegex("org\\.slf4j.*")
                    includeGroupByRegex("com\\.squareup.*")
                    includeGroupByRegex("org\\.ow2.*")
                }
            }
        }
        google()
        mavenLocal()
        mavenCentral()
        maven {
            url("https://jitpack.io")
            content {
                includeGroup("com.github.topjohnwu.libsu")
                includeGroup("com.github.Dimezis")
            }
        }
    }
    versionCatalogs {
        libs {
            version('hidden-api', '4.4.0')
            library('hidden-compat', 'dev.rikka.hidden', 'compat').versionRef('hidden-api')
            library('hidden-stub', 'dev.rikka.hidden', 'stub').versionRef('hidden-api')

            version('refine', '4.4.0')
            library('refine-runtime', 'dev.rikka.tools.refine', 'runtime').versionRef('refine')
            library('refine-annotation', 'dev.rikka.tools.refine', 'annotation').versionRef('refine')
            library('refine-annotation-processor', 'dev.rikka.tools.refine', 'annotation-processor').versionRef('refine')
        }
    }
}

include ':server', ':starter', ':shell'
// 兼容性 Stub 占位包（moe.shizuku.privileged.api）：产物由 manager 的 copyStubApk 打进 assets
include ':stub'
include ':manager'
include ':common'

def root = "api"

def propFile = file('local.properties')
def props = new Properties()

if (propFile.canRead()) {
    props.load(new FileInputStream(propFile))

    if (props != null) {
        if (props["api.useLocal"].equals("true")) {
            root = props["api.dir"]
        }
    }
}

include ':aidl'
project(':aidl').projectDir = file("$root${File.separator}aidl")

include ':rish'
project(':rish').projectDir = file("$root${File.separator}rish")

include ':shared'
project(':shared').projectDir = file("$root${File.separator}shared")

include ':api'
project(':api').projectDir = file("$root${File.separator}api")

include ':provider'
project(':provider').projectDir = file("$root${File.separator}provider")

include ':server-shared'
project(':server-shared').projectDir = file("$root${File.separator}server-shared")

include ':hidden-api-stub'
project(':hidden-api-stub').projectDir = file("$root${File.separator}hidden-api-stub")
