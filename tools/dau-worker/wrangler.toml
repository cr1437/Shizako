# Shizako 日活接收端（Cloudflare Worker）
# 部署：wrangler deploy
name = "shizako-dau"
main = "worker.js"
compatibility_date = "2026-10-01"

# 每日归档到 GitHub 的定时任务（UTC 00:10 = 北京时间 08:10）
[triggers]
crons = ["10 0 * * *"]

# KV 绑定：先 `wrangler kv namespace create DAU_KV`，把返回的 id 填到下面
[[kv_namespaces]]
binding = "DAU_KV"
id = "0b4347aec8394764aa92a1e650077a10"
