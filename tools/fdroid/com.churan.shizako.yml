MaintainerNotes: |
  Shizako is an Apache-2.0 fork of Shizuku (RikkaApps/Shizuku) that keeps its own app
  name, its own application id (com.churan.shizako) and its own permission names. It can
  be installed next to the official Shizuku: this build declares only its own provider
  authority (com.churan.shizako.shizuku), and the compatibility placeholder package that
  used to carry the upstream application id has been removed from the source tree
  entirely. Its server process is named shizako_server, so the two managers do not
  interfere with each other at start-up either.

  The variant switch is the in-repo Gradle property `-Pfdroid`, passed via `gradleprops`.
  It makes versionName carry a `-f` suffix (versionCode is unchanged), turns off the
  in-app updater and update checks, removes the one-click third-party APK installation
  and the AI explain feature, stops building and packaging the compatibility placeholder
  package (the `stub` module is not included, so no APK using the upstream application
  id is produced), declares only our own provider authority, switches the Gradle and
  Maven repositories to the official ones, and drops the `REQUEST_INSTALL_PACKAGES`
  declaration. Nothing in this variant uses that permission: there is no
  `PackageInstaller` session and no `ACTION_INSTALL_PACKAGE` in the sources, and the
  updater hands the downloaded APK to the system installer with `ACTION_VIEW` (the
  permission is needed by the app that performs the install, not by the caller). It is
  dropped by a `tools:node="remove"` manifest overlay that is fed to the variant only
  when the property is set, through AGP's `androidComponents` - still not a product
  flavour, so no task name, APK path or variant name changes. fdroidserver's build.py
  compares versionCode only, so the `-f` suffix is not repeated in `versionName` above;
  F-Droid's own AutoUpdateMode: Version writes the bare version name as well.

  The `rikka.shizuku.*` strings left in the DEX (protocol keys such as
  `moe.shizuku.privileged.api.intent.extra.BINDER`, the `moe.shizuku.server.*` AIDL
  descriptors and `ShizukuProvider.MANAGER_APPLICATION_ID`) come from the vendored
  shizuku-api sources (MIT, api/LICENSE) and are interop constants - not an application
  id, a permission or the app name. `shell/.../ShizukuShellLoader.java` is scanignored
  because the rish dex it loads is compiled from source in-tree during this build.

