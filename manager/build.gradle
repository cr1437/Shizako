        MaterialLightBlue { lightThemeFormat = "ThemeOverlay.Light.%s"; darkThemeFormat = "ThemeOverlay.Dark.%s"; primaryColor = "#03A9F4" }
        MaterialCyan { lightThemeFormat = "ThemeOverlay.Light.%s"; darkThemeFormat = "ThemeOverlay.Dark.%s"; primaryColor = "#00BCD4" }
        MaterialTeal { lightThemeFormat = "ThemeOverlay.Light.%s"; darkThemeFormat = "ThemeOverlay.Dark.%s"; primaryColor = "#009688" }
        MaterialGreen { lightThemeFormat = "ThemeOverlay.Light.%s"; darkThemeFormat = "ThemeOverlay.Dark.%s"; primaryColor = "#4CAF50" }
        MaterialLightGreen { lightThemeFormat = "ThemeOverlay.Light.%s"; darkThemeFormat = "ThemeOverlay.Dark.%s"; primaryColor = "#8BC34A" }
        MaterialLime { lightThemeFormat = "ThemeOverlay.Light.%s"; darkThemeFormat = "ThemeOverlay.Dark.%s"; primaryColor = "#CDDC39" }
