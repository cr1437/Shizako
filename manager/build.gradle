// ══════════ 兼容性占位包：已彻底移除 ══════════
// 以前这里会把 :stub 模块产出的占位 APK（applicationId = moe.shizuku.privileged.api，
// 应用名 "Shizuku"）复制进 manager/src/main/assets/，运行时由 StubManager 装到设备上，
// 好让把上游包名写死在代码里的第三方应用「看得见」管理器。
//
// 该做法逐字违反上游 Apache-2.0 §6 的 FORBIDDEN 条款（禁止以 moe.shizuku.privileged.api
// 作 application id、禁止以 Shizuku 作应用名）；而且任何人解包本应用跑一次
// `aapt2 dump badging assets/shizako-stub.apk` 就能看到那个包，从外部看与一份
// 「重打包改名的仿冒品」无法区分 —— 这正是被社区标记为仿冒的直接证据。
// 两个变体现在都停发它（详见 NOTICE 与 README 的「官方构建与校验」一节）。
//
// 这里保留一个无条件执行的清理任务：旧工作区、或从 GitHub 版切到 F-Droid 版时，
// assets 里可能还留着上一次构建生成的占位 APK，不删掉会被重新打进 APK ——
// 要根除的东西不能只靠「不再生成」。
def legacyStubApkFile = new File(projectDir.absolutePath, 'src/main/assets/shizako-stub.apk')

tasks.register('removeStubApk') {
    group = 'build'
    description = '确保 assets 里没有历史遗留的兼容性占位包 APK'
    outputs.upToDateWhen { !legacyStubApkFile.exists() }
    doLast {
        if (legacyStubApkFile.exists() && !legacyStubApkFile.delete()) {
            throw new GradleException("无法删除 ${legacyStubApkFile}，占位包不应被打进 APK")
        }
    }
}

def collapseReleaseResourceNames = task('collapseReleaseResourceNames').doLast {
    def aapt2 = Paths.get(project.android.sdkDirectory.path, 'build-tools', project.android.buildToolsVersion, 'aapt2')
    def zip = Paths.get(project.buildDir.path, 'intermediates',
            'optimized_processed_res', 'release', 'optimizeReleaseResources', 'resources-release-optimize.ap_')
    def optimized = new File("${zip}.opt")
    def cmd = exec {
        commandLine aapt2, 'optimize', '--collapse-resource-names',
                '--resources-config-path', 'aapt2-resources.cfg',
                '-o', optimized, zip
        ignoreExitValue false
    }
    if (cmd.exitValue == 0) {
        delete(zip)
        optimized.renameTo("$zip")
    }
}

afterEvaluate {
    tasks.getByName('optimizeReleaseResources').finalizedBy(collapseReleaseResourceNames)
    tasks.getByName('preReleaseBuild').dependsOn(':shell:assembleRelease')
    tasks.getByName('preDebugBuild').dependsOn(':shell:assembleDebug')
    // 历史遗留的 assets/shizako-stub.apk 必须在合并 assets 之前删掉，否则会被打进 APK。
    // 除了 preBuild，再直接挂到 mergeDebugAssets / mergeReleaseAssets 上：
    // 这样即使有人单独跑 `:manager:mergeDebugAssets`，也一定会先执行清理。
    tasks.getByName('preDebugBuild').dependsOn('removeStubApk')
    tasks.getByName('preReleaseBuild').dependsOn('removeStubApk')
    tasks.getByName('mergeDebugAssets').dependsOn('removeStubApk')
    tasks.getByName('mergeReleaseAssets').dependsOn('removeStubApk')
}

android.applicationVariants.configureEach { variant ->
    variant.outputs.configureEach {
        outputFileName = "shizako-${variant.versionName}-${variant.name}.apk"

        variant.assembleProvider.get().doLast {
            def outDir = new File(rootDir, "out")
            def mappingDir = new File(outDir, "mapping").absolutePath
            def apkDir = new File(outDir, "apk").absolutePath

            if (variant.getBuildType().isMinifyEnabled()) {
                copy {
                    from variant.mappingFileProvider.get()
                    into mappingDir
                    rename { String fileName -> "mapping-${variant.versionName}.txt" }
                }
                copy {
                    from outputFile
                    into apkDir
                }
            }
        }
    }
}

// 基线配置（baseline profile）：**不要**再全局禁用它。
// 这里原本有一段 `tasks.withType(CompileArtProfileTask).configureEach { enabled = false }`，
// 后果是 AGP 明明合并出了 421 KB 的 baseline-prof.txt，却从来没打进 APK
// （实测 release APK 内没有 assets/dexopt/baseline.prof），
// 连 Compose / Material3 / RecyclerView 自带的基线配置一起丢掉，冷启动只能靠 JIT 解释执行。
configurations.configureEach {
    exclude group: 'androidx.appcompat', module: 'appcompat'
    exclude group: 'androidx.profileinstaller', module: 'profileinstaller'
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    implementation project(':server')
    implementation project(':rish')
    implementation project(':starter')
    implementation project(':api')
    implementation project(':provider')

    implementation libs.hidden.compat
    compileOnly libs.hidden.stub

    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.7'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.5'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    implementation 'com.google.android.material:material:1.12.0'

    // Jetpack Compose：仅用于底部 Liquid Glass 导航栏（ComposeView 宿主在 activity_main.xml）
    implementation platform('androidx.compose:compose-bom:2025.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    // Material 3 1.4 起带官方运动方案 MaterialTheme.motionScheme（spatial/effects 弹簧参数），
    // 全部动画都取它，不再自己写时长/曲线 token。
    implementation 'androidx.compose.material3:material3:1.4.0'
    // 底栏图标库：Material Icons Extended（每个图标都有 Outlined/Filled 成对，
    // 正好对上「描边常驻 + 实心泛光」的选中动效）。库很大但 release 会被 R8 裁掉未用图标。
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'

    // 背景图取色：Palette API（dominantSwatch → titleTextColor / bodyTextColor）
    implementation 'androidx.palette:palette-ktx:1.0.0'

    // 背景模糊 / 材质：Haze（chrisbanes）—— 椒盐音乐的 Salt UI 用的就是它。
    // SaltUI 的 SaltHazeStyles（blurryGlass / acrylic / mica）直接跑在 Haze 上，
    // 所以这里用同一个库、同一套参数，材质观感才能对上。
    // 2.0.x 需要 Compose 1.12 / Kotlin 2.4（本项目工具链是 2.2.21 / Compose 1.9.4），
    // 1.6.10 正好是「Compose 1.8 起、Kotlin 2.1 起」的版本，功能和 API 够用。
    implementation 'dev.chrisbanes.haze:haze:1.6.10'

    implementation 'com.github.topjohnwu.libsu:core:6.0.0'

    // Real-time frosted glass for the app bar: https://github.com/Dimezis/BlurView
    // (RenderNode/RenderEffect on API 31+, RenderScript fallback below).
    // Bundled as source in src/main/java/eightbitlab/com/blurview (Apache-2.0):
    // the build sandbox cannot reach Maven mirrors reliably.

    implementation 'dev.rikka.rikkax.appcompat:appcompat:1.6.1'
    implementation 'dev.rikka.rikkax.compatibility:compatibility:2.0.0'
    implementation 'dev.rikka.rikkax.core:core-ktx:1.4.1'
    implementation 'dev.rikka.rikkax.material:material:2.7.2'
    implementation 'dev.rikka.rikkax.material:material-preference:2.0.0'
    implementation 'dev.rikka.rikkax.html:html-ktx:1.1.2'
    implementation 'dev.rikka.rikkax.recyclerview:recyclerview-adapter:1.3.0'
    implementation 'dev.rikka.rikkax.recyclerview:recyclerview-ktx:1.3.2'
    implementation 'dev.rikka.rikkax.insets:insets:1.3.0'
    implementation 'dev.rikka.rikkax.layoutinflater:layoutinflater:1.3.0'
    implementation 'dev.rikka.rikkax.widget:borderview:1.1.0'
    implementation 'dev.rikka.rikkax.preference:simplemenu-preference:1.0.3'
    implementation 'dev.rikka.rikkax.lifecycle:lifecycle-resource-livedata:1.0.1'
    implementation 'dev.rikka.rikkax.lifecycle:lifecycle-shared-viewmodel:1.0.1'
    implementation 'dev.rikka.rikkax.lifecycle:lifecycle-viewmodel-lazy:2.0.0'

    implementation 'io.github.vvb2060.ndk:boringssl:20250114'
    implementation 'org.lsposed.libcxx:libcxx:27.0.12077973'

    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'

    implementation 'org.bouncycastle:bcpkix-jdk18on:1.80'

    implementation 'me.zhanghai.android.appiconloader:appiconloader:1.5.0'
}

apply from: rootProject.file('signing.gradle')
