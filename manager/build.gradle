// 变体开关：`-Pfdroid` 生成 F-Droid 版（版本名带 -f、关闭若干功能）。
// 在脚本顶层定义一次，android{} / 任务注册 / afterEvaluate 里共用同一个判断。
def fdroidBuild = project.hasProperty('fdroid')

android {
    namespace 'moe.shizuku.manager'
    defaultConfig {
        applicationId "com.churan.shizako"
        versionCode rootProject.ext.versionCode
        // F-Droid 版（-Pfdroid）：版本名带 -f 后缀，一眼区分两个变体。
        //   GitHub 版：./gradlew :manager:assembleRelease          → zako3.13
        //   F-Droid 版：./gradlew :manager:assembleRelease -Pfdroid → zako3.13-f
        // 用构建属性而不是 productFlavors：flavor 会把产物路径改成 apk/<flavor>/release/，
        // 影响现有发版脚本与官网下载链接；这里保持路径不变。
        versionName rootProject.ext.versionName + (fdroidBuild ? '-f' : '')
        // 编译期开关，供 fdroid/FdroidBuild.kt 集中判断（F-Droid 版需关闭若干功能）
        buildConfigField "boolean", "FDROID_BUILD", "${fdroidBuild}"
        // 兼容桥的 provider authority（对应 AndroidManifest 里的 ${compatAuthority}）。
        //
        // 两个变体都**只**声明我们自己的 authority。以前 GitHub 版会额外声明上游的
        // moe.shizuku.privileged.api.shizuku，好处是「早期客户端直接按该 authority 寻址
        // 管理器」；代价有两层，都是硬伤：
        //   1. 上游 Apache-2.0 §6 禁止 fork 使用上游身份（README 的 FORBIDDEN 条款）；
        //   2. 声明该 authority 会让本应用**无法与官方 Shizuku 共存**（provider 冲突），
        //      这本身就像仿冒行为。
        // 实测（Android 16 + Hail / MT 管理器）：新版客户端由管理器主动把 binder 推进
        // 客户端自己的 provider，不依赖这个 authority，所以去掉它不影响正常使用。
        manifestPlaceholders = [
                compatAuthority: "com.churan.shizako.shizuku"
        ]
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
            }
        }
    }
    buildFeatures {
        buildConfig true
        viewBinding true
        prefab true
        compose true
    }
    signingConfigs {
        sign
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.sign
        }
        release {
            signingConfig signingConfigs.sign
            minifyEnabled true
            shrinkResources true
            vcsInfo.include false
            proguardFiles 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            version = "3.31.0+"
        }
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['**']
        }
    }
    dependenciesInfo {
        includeInApk false
    }
    lint {
        checkReleaseBuilds false
    }
}

// ══════════ F-Droid 变体的 manifest 覆盖层 ══════════
// 只给 `-Pfdroid` 的构建多喂一份只做减项的 manifest（tools:node="remove"），
// 用来去掉本变体里没有任何使用方的权限声明 —— 目前是
// android.permission.REQUEST_INSTALL_PACKAGES，详见该文件里的注释。
//
// 为什么不用 productFlavors：flavor 会把产物路径改成 apk/<flavor>/release/，
// 牵动发版脚本、官网下载链接和 F-Droid recipe；这里任务名、产物路径、
// 变体名（release）全都不变，只是同一变体多一个 manifest 合并输入。
// 注意 API 是 addStaticManifestFile（ManifestFiles 上**没有**
// addStaticSourceDirectory，那个方法在 SourceDirectories.Layered 上）。
androidComponents {
    onVariants(selector().all()) { variant ->
        if (fdroidBuild) {
            variant.sources.manifests?.addStaticManifestFile('src/fdroid/AndroidManifest.xml')
        }
    }
}

autoResConfig {
    generatedClassFullName = "rikka.shizuku.manager.ShizukuLocales"
    generateRes = false
    generatedArrayFirstItem = "SYSTEM"
    generateLocaleConfig = true
}

