// ══════════ 兼容性 Stub APK 打进 assets ══════════
// 为什么用"复制"而不是把 :stub 当依赖：stub 是个独立 application 模块，不能作为 library 被依赖；
// 它唯一的用途就是产出那个包名为 moe.shizuku.privileged.api 的占位 APK，
// 由 StubManager 在运行时从 assets 里解出来再 pm install。
def stubApkFile = new File(projectDir.absolutePath, 'src/main/assets/shizako-stub.apk')

tasks.register('copyStubApk') {
    group = 'build'
    description = '把 :stub 的 debug APK 复制到 manager/src/main/assets/shizako-stub.apk'
    // 显式依赖跨模块任务：这样单独跑 :stub:assembleDebug 也能工作，
    // 跑 :manager:assembleDebug 时也会先自动把 stub 编出来。
    dependsOn ':stub:assembleDebug'
    inputs.file("${rootProject.projectDir}/stub/build/outputs/apk/debug/stub-debug.apk")
    // 把 assets 里的产物也算进输入：文件被删掉时任务不会因为"输出已存在"而跳过
    inputs.file(stubApkFile).optional()
    outputs.file(stubApkFile)
    doLast {
        def src = file("${rootProject.projectDir}/stub/build/outputs/apk/debug/stub-debug.apk")
        if (!src.exists()) {
            throw new GradleException("stub APK 不存在：${src}（先执行 :stub:assembleDebug）")
        }
        stubApkFile.parentFile.mkdirs()
        copy {
            from src
            into stubApkFile.parentFile
            rename { 'shizako-stub.apk' }
        }
    }
}

// 手动重新生成（改了 stub 或想刷新 assets 里的 APK 时）：
//   $env:JAVA_HOME='E:\jdk21'; $env:GRADLE_USER_HOME='E:\gh'; .\gradlew.bat :manager:copyStubApk "-Djava.io.tmpdir=E:/tmp"
// assets 里的 APK 是产物而非源码，正常情况下不用手工动它，preBuild 会自动刷新。

def collapseReleaseResourceNames = task('collapseReleaseResourceNames').doLast {
    def aapt2 = Paths.get(project.android.sdkDirectory.path, 'build-tools', project.android.buildToolsVersion, 'aapt2')
    def zip = Paths.get(project.buildDir.path, 'intermediates',
            'optimized_processed_res', 'release', 'optimizeReleaseResources', 'resources-release-optimize.ap_')
    def optimized = new File("${zip}.opt")
    def cmd = exec {
        commandLine aapt2, 'optimize', '--collapse-resource-names',
                '--resources-config-path', 'aapt2-resources.cfg',
                '-o', optimized, zip
        ignoreExitValue false
    }
    if (cmd.exitValue == 0) {
        delete(zip)
        optimized.renameTo("$zip")
    }
}

afterEvaluate {
    tasks.getByName('optimizeReleaseResources').finalizedBy(collapseReleaseResourceNames)
    tasks.getByName('preReleaseBuild').dependsOn(':shell:assembleRelease')
    tasks.getByName('preDebugBuild').dependsOn(':shell:assembleDebug')
    // stub 占位 APK 必须在打包 assets 之前就位，否则第一次构建出来的 APK 里没有它。
    // 除了 preBuild，再直接挂到 mergeDebugAssets / mergeReleaseAssets 上：
    // 这样即使有人单独跑 `:manager:mergeDebugAssets`，也一定会先把 APK 复制过来。
    tasks.getByName('preDebugBuild').dependsOn('copyStubApk')
    tasks.getByName('preReleaseBuild').dependsOn('copyStubApk')
    tasks.getByName('mergeDebugAssets').dependsOn('copyStubApk')
    tasks.getByName('mergeReleaseAssets').dependsOn('copyStubApk')
}

android.applicationVariants.configureEach { variant ->
    variant.outputs.configureEach {
        outputFileName = "shizako-v${variant.versionName}-${variant.name}.apk"

        variant.assembleProvider.get().doLast {
            def outDir = new File(rootDir, "out")
            def mappingDir = new File(outDir, "mapping").absolutePath
            def apkDir = new File(outDir, "apk").absolutePath

            if (variant.getBuildType().isMinifyEnabled()) {
                copy {
                    from variant.mappingFileProvider.get()
                    into mappingDir
                    rename { String fileName -> "mapping-${variant.versionName}.txt" }
                }
                copy {
                    from outputFile
                    into apkDir
                }
            }
        }
    }
}

