org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# 注意：曾经在这里带过 -Djava.io.tmpdir=E:/tmp（开发机专用路径）。
# 绝对不要再加回来 —— CI（GitHub runner）与 F-Droid 构建机都是 Linux，
# E:/tmp 不存在，Gradle 启动即抛 "java.io.tmpdir is set to a directory
# that doesn't exist" 秒挂（2026-10-01 踩过，见 ci 相关提交）。
# 如本机确实需要独立临时目录，用环境变量 JAVA_TOOL_OPTIONS 或
# gradle -D 参数按需传，不要写进这个被跟踪的文件。
android.useAndroidX=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# Faster dependency resolution
org.gradle.parallel=true
org.gradle.caching=true
